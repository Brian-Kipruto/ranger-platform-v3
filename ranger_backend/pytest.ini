# ─── RANGER V3 START: pytest config ───
# Lives in ranger_backend/ (NOT the repo root) so pytest's rootdir sits next to
# manage.py and `core`, `missions`, `accounts` import as top-level packages.
# Run from ranger_backend/:  pytest
[pytest]
DJANGO_SETTINGS_MODULE = ranger_backend.settings.development
python_files = tests.py test_*.py *_tests.py
# Every app with tests must be listed — pytest will NOT discover apps absent
# from this line, and an uncollected test file is indistinguishable from a
# passing one. Add new apps here when you add them to LOCAL_APPS.
testpaths = core missions accounts satellite_integration

# -ra shows a summary of everything that wasn't a plain pass, including the
# reasons for skips — useful when the PostGIS test DB can't be created.
addopts = -ra --strict-markers

markers =
    geo: touches PostGIS geometry or spatial queries (F10.1+)
    integration: hits a real external service (Earth Engine); skipped without credentials

# NOTE on --reuse-db:
#   `pytest --reuse-db` keeps test_ranger_v3 between runs and is much faster.
#   It also means a stale test DB survives a schema migration. After any
#   `manage.py migrate` that changes columns, run once with `--create-db`.
# ─── RANGER V3 END: pytest config ───
