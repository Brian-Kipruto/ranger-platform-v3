# ─── RANGER V3 START: 12-field-time ───
# PC (brian@Kipruto): serve time to the Orin. Installed as
#   /etc/chrony/conf.d/ranger.conf   (Ubuntu's chrony.conf reads conf.d)
# See docs/features/12-field-time.md for install and proof.
#
# The Orin's clock is checked against THIS machine (ros_ingest's skew guard,
# ADR-0015), so the Orin syncs to it — by IP, never by name (TS-025).

# Clients allowed. USB tether now; the travel router's subnet is added in 4d.
allow 192.168.55.0/24

# Keep serving when the PC itself has no upstream time (no internet at the
# venue). Without this chrony answers nothing while unsynchronized, and the
# Orin would boot with the wrong clock exactly when it matters.
# distance 3: the default (1 s) switched to the local clock even ONLINE, because
# upstream root distances here run ~1.2 s — the PC then stopped tracking real
# time. 3 s keeps internet time whenever it is usable.
local stratum 10 distance 3
# ─── RANGER V3 END: 12-field-time ───
