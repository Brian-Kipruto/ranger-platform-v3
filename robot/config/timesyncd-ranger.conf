# ─── RANGER V3 START: 12-field-time ───
# Orin (brian@jetson-orin): take time from the PC only. Installed as
#   /etc/systemd/timesyncd.conf.d/ranger.conf
# See docs/features/12-field-time.md for install and proof.
#
# IP literals only: the Orin's DNS broke across reboots (TS-025), and a pool
# hostname is why it never synced before. Empty FallbackNTP= disables the
# built-in pool fallback, which needs DNS anyway.
# F14 4d: the PC on the house Wi-Fi (its router reservation) first, the field
# link; the USB tether second. timesyncd moves on when a server doesn't answer.
[Time]
NTP=192.168.0.102 192.168.55.100
FallbackNTP=
# ─── RANGER V3 END: 12-field-time ───
